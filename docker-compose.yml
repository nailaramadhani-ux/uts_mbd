version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_NailaR
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "22026:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin_NailaR
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: naila@example.com
      PGADMIN_DEFAULT_PASSWORD: ifunggul
    ports:
      - "44026:80"
    depends_on:
      - postgres

volumes:
  pgdata: